name: m4 P2 memory governance contracts

on:
  push:
    branches:
      - runtime/p2-memory-governance-contracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: P2 memory governance python contract
        run: python3 firmware/tests/test_m4_memory_governance_contract.py

      - name: P2 memory governance host cpp contract
        run: |
          g++ -std=c++17 \
            -Ifirmware/src/memory \
            tests/contracts/memory_governance_contracts_red.cpp \
            firmware/src/memory/M4MemoryGovernance.cpp \
            -o /tmp/m4_memory_governance_contract
          /tmp/m4_memory_governance_contract

  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python3 -m pip install --user platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap firmware dependencies
        run: bash scripts/bootstrap_deps.sh

      - name: Build unchanged Murphy production profile
        working-directory: firmware
        run: |
          pio run -e murphy_m4
          test -f .pio/build/murphy_m4/firmware.bin

      - name: Build Murphy plugin-debug QEMU profile
        working-directory: firmware
        run: |
          pio run -e murphy_m4_qemu_plugin
          test -f .pio/build/murphy_m4_qemu_plugin/firmware.bin

# P2 gate rules:
# - verify deterministic memory governance accounting in host tests
# - compile/run QEMU-compatible memory governance contract
# - build production and plugin-debug simulator profiles
# - no real-device flashing or hardware validation dependency
