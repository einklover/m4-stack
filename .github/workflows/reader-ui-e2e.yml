name: reader UI QEMU journey

on:
  pull_request:
    branches: [main]
    paths:
      - 'm4sim'
      - 'simulator/m4sim.py'
      - 'simulator/tests/reader_ui_e2e.py'
      - 'simulator/qemu/**'
      - 'simulator/tools/murphy_flash_image.py'
      - 'firmware/scripts/m4adb.py'
      - 'firmware/scripts/m4adb_lib/**'
      - 'firmware/platformio.ini'
      - 'firmware/src/**'
      - 'scripts/bootstrap_deps.sh'
      - '.github/workflows/reader-ui-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-pip python3-venv \
            libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev libsdl2-dev \
            flex bison dosfstools mtools
          python3 -m pip install --user -r simulator/qemu/requirements.txt platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap firmware deps
        run: bash scripts/bootstrap_deps.sh

      - name: Build patched QEMU
        run: |
          python3 simulator/qemu/build.py \
            --source-dir "$RUNNER_TEMP/espressif-qemu-v3" \
            --reconfigure -j 2
          test -x "$RUNNER_TEMP/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa" \
            || test -x "$RUNNER_TEMP/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa-unsigned"

      - name: Run real reader UI journey
        env:
          QEMU_XTENSA: ${{ runner.temp }}/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa
          M4SIM_READER_TMP: ${{ runner.temp }}/m4sim-reader-ui
        run: |
          if [[ ! -x "$QEMU_XTENSA" ]]; then
            export QEMU_XTENSA="${QEMU_XTENSA}-unsigned"
          fi
          ./m4sim test reader-ui --plugin-debug --ready-seconds 150

      - name: Upload reader UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4sim-reader-ui
          path: ${{ runner.temp }}/m4sim-reader-ui/**
          if-no-files-found: ignore
