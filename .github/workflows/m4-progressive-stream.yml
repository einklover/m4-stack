name: Murphy progressive stream regressions

on:
  push:
    branches:
      - agent/m4-emulator-stage13-e2e-validation
    paths:
      - 'firmware/src/apps/M4xProgressiveLoader.*'
      - 'firmware/src/apps/M4xProgressiveHttpState.h'
      - 'firmware/src/apps/M4xJsonStream.h'
      - 'firmware/src/apps/providers/M4ProgressiveCatalog.h'
      - 'firmware/tests/native_app/test_progressive_http_state.cpp'
      - 'firmware/tests/native_app/test_progressive_catalog.cpp'
      - 'firmware/tests/native_app/test_jjwxc_catalog_shape.cpp'
      - 'scripts/bootstrap_deps.sh'
      - '.github/workflows/m4-progressive-stream.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/src/apps/M4xProgressiveLoader.*'
      - 'firmware/src/apps/M4xProgressiveHttpState.h'
      - 'firmware/src/apps/M4xJsonStream.h'
      - 'firmware/src/apps/M4xJsonStream.h'
      - 'firmware/src/apps/providers/M4ProgressiveCatalog.h'
      - 'firmware/tests/native_app/test_progressive_http_state.cpp'
      - 'firmware/tests/native_app/test_progressive_catalog.cpp'
      - 'firmware/tests/native_app/test_jjwxc_catalog_shape.cpp'
      - 'scripts/bootstrap_deps.sh'
      - '.github/workflows/m4-progressive-stream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-stream-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Payload inactivity and chunk-boundary state
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/tests/native_app/test_progressive_http_state.cpp \
            -o "$RUNNER_TEMP/test_progressive_http_state"
          "$RUNNER_TEMP/test_progressive_http_state"

      - name: JJWXC 5,000-row streaming catalog
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/tests/native_app/test_jjwxc_catalog_shape.cpp \
            -o "$RUNNER_TEMP/test_jjwxc_catalog_shape"
          "$RUNNER_TEMP/test_jjwxc_catalog_shape"

      - name: Shared progressive catalog policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/tests/native_app/test_progressive_catalog.cpp \
            -o "$RUNNER_TEMP/test_progressive_catalog"
          "$RUNNER_TEMP/test_progressive_catalog"

  firmware-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Bootstrap firmware dependencies
        run: bash scripts/bootstrap_deps.sh

      - name: Compile Murphy M4 production profile
        working-directory: firmware
        shell: bash
        run: |
          set +e
          pio run -e murphy_m4 2>&1 | tee "$RUNNER_TEMP/murphy-m4-production-build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "Murphy M4 production compile failed (exit=$status)."
              echo "First compiler/linker diagnostics:"
              grep -n -m 24 -E 'fatal error:|error:|undefined reference|will not fit in region|region .* overflowed|collect2: error' \
                "$RUNNER_TEMP/murphy-m4-production-build.log" || true
              echo
              echo "Last 160 build-log lines:"
              tail -n 160 "$RUNNER_TEMP/murphy-m4-production-build.log"
            } > "$RUNNER_TEMP/murphy-m4-production-compile-failure.txt"
          fi
          exit "$status"

      - name: Upload production compile failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: murphy-m4-production-compile-failure
          path: ${{ runner.temp }}/murphy-m4-production-compile-failure.txt
          if-no-files-found: ignore
          retention-days: 7
