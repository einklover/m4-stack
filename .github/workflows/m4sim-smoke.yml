name: m4sim clean BIN smoke

# Uses the same ./m4sim entry as local developers (not a hand-rolled QEMU cmdline).

on:
  pull_request:
    branches: [main]
    paths:
      - 'm4sim'
      - 'simulator/m4sim.py'
      - 'simulator/tests/**'
      - 'simulator/qemu/**'
      - 'simulator/tools/murphy_flash_image.py'
      - 'firmware/scripts/m4adb.py'
      - 'firmware/scripts/m4adb_lib/**'
      - 'firmware/platformio.ini'
      - 'firmware/src/**'
      - 'scripts/bootstrap_deps.sh'
      - '.github/workflows/m4sim-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-pip python3-venv \
            libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev libsdl2-dev \
            flex bison dosfstools
          python3 -m pip install --user -r simulator/qemu/requirements.txt platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap firmware deps
        run: bash scripts/bootstrap_deps.sh

      - name: Build patched QEMU (single entry)
        run: |
          python3 simulator/qemu/build.py \
            --source-dir "$RUNNER_TEMP/espressif-qemu-v3" \
            --reconfigure -j 2
          test -x "$RUNNER_TEMP/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa" \
            || test -x "$RUNNER_TEMP/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa-unsigned"

      - name: m4sim info
        env:
          QEMU_XTENSA: ${{ runner.temp }}/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa
        run: |
          if [[ ! -x "$QEMU_XTENSA" ]]; then
            QEMU_XTENSA="${QEMU_XTENSA}-unsigned"
            export QEMU_XTENSA
          fi
          ./m4sim info

      - name: m4sim test smoke (plugin-debug path)
        env:
          QEMU_XTENSA: ${{ runner.temp }}/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa
          M4SIM_SMOKE_TMP: ${{ runner.temp }}/m4sim-smoke
        run: |
          if [[ ! -x "$QEMU_XTENSA" ]]; then
            export QEMU_XTENSA="${QEMU_XTENSA}-unsigned"
          fi
          ./m4sim test smoke --plugin-debug --ready-seconds 150

      - name: m4sim test network-manager (real Home UI)
        env:
          QEMU_XTENSA: ${{ runner.temp }}/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa
          M4SIM_NETWORK_TMP: ${{ runner.temp }}/m4sim-network-manager
        run: |
          if [[ ! -x "$QEMU_XTENSA" ]]; then
            export QEMU_XTENSA="${QEMU_XTENSA}-unsigned"
          fi
          ./m4sim test network-manager --plugin-debug --skip-build --ready-seconds 150

      - name: Stage portable m4sim runtime bundle
        if: success()
        env:
          QEMU_XTENSA: ${{ runner.temp }}/espressif-qemu-v3/build-murphy-v3/qemu-system-xtensa
        run: |
          set -euo pipefail
          if [[ ! -x "$QEMU_XTENSA" ]]; then
            QEMU_XTENSA="${QEMU_XTENSA}-unsigned"
          fi
          B="$RUNNER_TEMP/m4sim-runtime"
          mkdir -p "$B/bin" "$B/lib" "$B/pc-bios" "$B/python" "$B/firmware/scripts" "$B/simulator/tools"
          cp "$QEMU_XTENSA" "$B/bin/qemu-system-xtensa"

          # ESP32-S3 QEMU needs this runtime ROM, but the upstream pc-bios README
          # does not state a standalone redistribution license for this binary.
          # Do NOT upload the ROM. Publish only its pinned source and checksum;
          # the recipient can fetch it directly from the official upstream repo.
          ROM="$RUNNER_TEMP/espressif-qemu-v3/pc-bios/esp32s3_rev0_rom.bin"
          test -s "$ROM"
          ROM_SHA="$(sha256sum "$ROM" | awk '{print $1}')"
          printf '%s  %s\n' "$ROM_SHA" 'pc-bios/esp32s3_rev0_rom.bin' > "$B/ROM_SHA256SUM"
          cat > "$B/ROM_SOURCE.txt" <<'EOF'
          repository=https://github.com/espressif/qemu.git
          ref=febae182e132e4055529be423a818225ebddaa3a
          path=pc-bios/esp32s3_rev0_rom.bin
          EOF
          cat > "$B/fetch-rom.py" <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import hashlib
          import urllib.request

          root = Path(__file__).resolve().parent
          expected = (root / "ROM_SHA256SUM").read_text().split()[0]
          out = root / "pc-bios" / "esp32s3_rev0_rom.bin"
          url = ("https://raw.githubusercontent.com/espressif/qemu/"
                 "febae182e132e4055529be423a818225ebddaa3a/"
                 "pc-bios/esp32s3_rev0_rom.bin")
          out.parent.mkdir(parents=True, exist_ok=True)
          print(f"fetching pinned ESP32-S3 ROM from official upstream: {url}")
          with urllib.request.urlopen(url, timeout=60) as r:
              data = r.read()
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise SystemExit(f"ROM sha256 mismatch: got {digest}, expected {expected}")
          out.write_bytes(data)
          print(f"wrote {out} ({len(data)} bytes, sha256={digest})")
          PY
          chmod +x "$B/fetch-rom.py"

          # These are the two non-baseline shared libraries missing from the
          # clean execution container used for cross-machine validation. Copy
          # their resolved SONAME targets rather than runner symlinks.
          for SONAME in libslirp.so.0 libsndio.so.7; do
            LIB="$(ldconfig -p | awk -v n="$SONAME" '$1 == n {print $NF; exit}')"
            test -n "$LIB" && test -r "$LIB"
            cp -L "$LIB" "$B/lib/$SONAME"
          done

          cat > "$B/bin/qemu-m4" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          ROOT="$(cd "$HERE/.." && pwd)"
          ROM="$ROOT/pc-bios/esp32s3_rev0_rom.bin"
          if [[ ! -s "$ROM" ]]; then
            echo "ESP32-S3 ROM is not present in this artifact." >&2
            echo "Run: python3 $ROOT/fetch-rom.py" >&2
            exit 2
          fi
          export LD_LIBRARY_PATH="$ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/qemu-system-xtensa" -L "$ROOT/pc-bios" "$@"
          EOF
          chmod +x "$B/bin/qemu-m4"

          cp "$RUNNER_TEMP/m4sim-smoke/artifacts/flash-16m.bin" "$B/flash-16m.bin"
          cp "$RUNNER_TEMP/m4sim-smoke/artifacts/murphy-sd.img" "$B/murphy-sd.img"
          cp "$RUNNER_TEMP/m4sim-smoke/artifacts/ssd1677-frame.pbm" "$B/boot-frame.pbm" 2>/dev/null || true
          cp firmware/scripts/m4adb.py "$B/firmware/scripts/"
          cp -a firmware/scripts/m4adb_lib "$B/firmware/scripts/"
          cp simulator/tools/m4_screen_viewer.py "$B/simulator/tools/" 2>/dev/null || true
          python3 -m pip install --quiet --target "$B/python" 'pyserial>=3.5'

          ldd "$QEMU_XTENSA" > "$B/qemu-ldd.txt" || true
          "$QEMU_XTENSA" --version > "$B/qemu-version.txt"
          "$QEMU_XTENSA" -machine help > "$B/qemu-machines.txt"
          grep -q 'murphy-m4' "$B/qemu-machines.txt"

          # Relocatable checksums cover only files we actually redistribute.
          (
            cd "$B"
            sha256sum bin/qemu-system-xtensa lib/libslirp.so.0 lib/libsndio.so.7 \
              flash-16m.bin murphy-sd.img fetch-rom.py ROM_SOURCE.txt ROM_SHA256SUM \
              > SHA256SUMS
          )

          cat > "$B/README.txt" <<'EOF'
          This artifact is produced only after ./m4sim test smoke succeeds.
          It contains the exact Linux x86_64 patched QEMU v3, flash image, SD image,
          m4adb Python runtime, and required shared libraries used by that run.

          The ESP32-S3 ROM is intentionally NOT redistributed because its standalone
          binary redistribution terms are not explicit in upstream pc-bios/README.
          Run `python3 fetch-rom.py` to fetch the exact ROM from the pinned official
          Espressif QEMU commit and verify its SHA256 before use.

          Then use bin/qemu-m4 so bundled libraries and pc-bios are resolved explicitly.
          Set PYTHONPATH=<bundle>/python when invoking firmware/scripts/m4adb.py.
          Verify artifact files after extraction with: sha256sum -c SHA256SUMS
          EOF
          printf '%s\n' "${GITHUB_SHA}" > "$B/git-sha.txt"

      - name: Upload portable runtime bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m4sim-runtime-linux-x64
          path: ${{ runner.temp }}/m4sim-runtime/**
          if-no-files-found: error
          compression-level: 1

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4sim-smoke
          path: |
            ${{ runner.temp }}/m4sim-smoke/**
          if-no-files-found: ignore

      - name: Upload network manager artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4sim-network-manager
          path: |
            ${{ runner.temp }}/m4sim-network-manager/**
          if-no-files-found: ignore
