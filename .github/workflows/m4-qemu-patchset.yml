name: Murphy QEMU patchset

on:
  pull_request:
    paths:
      - 'simulator/qemu/**'
      - 'simulator/tests/test_qemu_production_runner.py'
      - 'simulator/tests/test_qemu_patchset.py'
      - '.github/workflows/m4-qemu-patchset.yml'
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev libgcrypt20-dev \
            libslirp-dev libsdl2-dev flex bison

      - name: Run emulator unit tests
        run: |
          python3 -m unittest \
            simulator/tests/test_qemu_production_runner.py \
            simulator/tests/test_qemu_patchset.py

      - name: Apply Murphy patches and build Xtensa QEMU
        run: |
          python3 simulator/qemu/build_patched_qemu.py \
            --source-dir "$RUNNER_TEMP/espressif-qemu" \
            --reconfigure -j 2

      - name: Smoke-check patched QEMU binary
        run: |
          "$RUNNER_TEMP/espressif-qemu/build-murphy/qemu-system-xtensa" --version

      - name: Save pinned patch provenance
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/m4-qemu-provenance"
          cp simulator/qemu/patches/upstream.json "$RUNNER_TEMP/m4-qemu-provenance/"
          cp simulator/qemu/patches/series "$RUNNER_TEMP/m4-qemu-provenance/"
          git -C "$RUNNER_TEMP/espressif-qemu" status --short > "$RUNNER_TEMP/m4-qemu-provenance/qemu-status.txt" || true
          git -C "$RUNNER_TEMP/espressif-qemu" rev-parse HEAD > "$RUNNER_TEMP/m4-qemu-provenance/qemu-head.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: murphy-qemu-patch-provenance
          path: ${{ runner.temp }}/m4-qemu-provenance
