name: Murphy QEMU patchset

on:
  pull_request:
    paths:
      - 'simulator/qemu/**'
      - 'simulator/tests/test_qemu_production_runner.py'
      - 'simulator/tests/test_qemu_patchset.py'
      - '.github/workflows/m4-qemu-patchset.yml'
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev libgcrypt20-dev \
            libslirp-dev libsdl2-dev flex bison

      - name: Run emulator unit tests
        run: |
          python3 -m unittest \
            simulator/tests/test_qemu_production_runner.py \
            simulator/tests/test_qemu_patchset.py

      - name: Apply Murphy patches and build Xtensa QEMU
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/m4-qemu-provenance"
          python3 simulator/qemu/build_patched_qemu.py \
            --source-dir "$RUNNER_TEMP/espressif-qemu" \
            --reconfigure -j 2 \
            2>&1 | tee "$RUNNER_TEMP/m4-qemu-provenance/build.log"

      - name: Smoke-check patched QEMU binary
        run: |
          "$RUNNER_TEMP/espressif-qemu/build-murphy/qemu-system-xtensa" --version

      - name: Save pinned patch provenance
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/m4-qemu-provenance"
          cp simulator/qemu/patches/upstream.json "$RUNNER_TEMP/m4-qemu-provenance/"
          cp simulator/qemu/patches/series "$RUNNER_TEMP/m4-qemu-provenance/"
          git -C "$RUNNER_TEMP/espressif-qemu" status --short > "$RUNNER_TEMP/m4-qemu-provenance/qemu-status.txt" || true
          git -C "$RUNNER_TEMP/espressif-qemu" rev-parse HEAD > "$RUNNER_TEMP/m4-qemu-provenance/qemu-head.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: murphy-qemu-patch-provenance
          path: ${{ runner.temp }}/m4-qemu-provenance

  full-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      M4_E2E_ARTIFACTS: ${{ runner.temp }}/m4-full-e2e/artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Install full-chain host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-pip python3-venv \
            libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev libsdl2-dev \
            flex bison dosfstools mtools fonts-wqy-zenhei git
          python3 -m pip install --break-system-packages platformio pyserial fonttools

      - name: Bootstrap firmware dependencies
        run: bash scripts/bootstrap_deps.sh

      - name: Run full-chain TTF TXT and plugin E2E
        run: python3 simulator/qemu/run_full_e2e_ci.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: murphy-full-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-full-e2e/artifacts
          if-no-files-found: warn
