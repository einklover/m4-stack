[platformio]
default_envs = gh_release

[crosspoint]
version = 202608187

; ── Common base (hardware-independent build config) ──────────────────────────
[base]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_CDC_RX_BUFFER_SIZE=8192
  -DARDUINO_USB_CDC_TX_BUFFER_SIZE=8192
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DMINIZ_NO_STDIO=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
# Disable features to save flash for BLE
  -DDISABLE_OPDS=1
  -DDISABLE_CALIBRE=1
  -DDISABLE_QR_CODE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# NimBLE memory optimization: limit to 1 connection, reduce stack/RAM usage
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BTDM_CTRL_BLE_MAX_CONN=1

build_unflags =
  -std=gnu++11

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_files = src/network/updater_fw.bin

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py

; Common third-party libraries (shared by both X4 and X3)
lib_deps_common =
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  links2004/WebSockets @ 2.7.3
  h2zero/NimBLE-Arduino @ 2.3.6

; ── X4 base (Xteink X4 hardware SDK) ────────────────────────────────────────
[x4_base]
extends = base
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  ${base.lib_deps_common}

; ── X3 base (Xteink X3 hardware SDK, enables CROSSPOINT_X3 flag) ────────────
[x3_base]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_X3=1
lib_deps =
  BatteryMonitor=symlink://open-x3-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x3-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x3-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x3-sdk/libs/hardware/SDCardManager
  ${base.lib_deps_common}

; ── X4 environments ──────────────────────────────────────────────────────────
[env:default]
extends = x4_base
build_flags =
  ${x4_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ble\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  -D ARDUINO_LOOP_STACK_SIZE=16384


[env:gh_release]
extends = x4_base
build_flags =
  ${x4_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DNO_DEBUG_LOG
  -DLOG_LEVEL=0 ; Set log level to error for release builds
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192  
  -D ARDUINO_LOOP_STACK_SIZE=16384

[env:gh_release_rc]
extends = x4_base
build_flags =
  ${x4_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192  
  -D ARDUINO_LOOP_STACK_SIZE=16384

[env:slim]
extends = x4_base
build_flags =
  ${x4_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; ── X3 environments ──────────────────────────────────────────────────────────
[env:x3_default]
extends = x3_base
build_flags =
  ${x3_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x3-ble\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  -D ARDUINO_LOOP_STACK_SIZE=16384

[env:x3_gh_release]
extends = x3_base
build_flags =
  ${x3_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x3\"
  -DENABLE_SERIAL_LOG
  -DNO_DEBUG_LOG
  -DLOG_LEVEL=0 ; Set log level to error for release builds
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  -D ARDUINO_LOOP_STACK_SIZE=16384
[env:x3_slim]
extends = x3_base
build_flags =
  ${x3_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x3-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; ── Murphy M4 base (ESP32-S3, FreeInk M4 SDK, no absolute/symlink deps) ─────
; Proven partition layout and platform versions from m4-crosspoint-native.
; Application is sized for factory OTA slot app1 @ 0x6e0000. Do not use a
; generic full-flash upload that would overwrite the factory partition table.
[m4_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 7143424
board_upload.offset_address = 0x6e0000

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_murphy_m4.csv
board_build.embed_files = src/network/updater_fw.bin

build_unflags =
  -std=gnu++11

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_CDC_RX_BUFFER_SIZE=8192
  -DARDUINO_USB_CDC_TX_BUFFER_SIZE=8192
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DMINIZ_NO_STDIO=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; 帧缓冲(47KB)放 PSRAM: 内部 RAM 连续大块留给 TLS(40KB 门控), 消除刷新时的堆碎片
  -DFREEINK_FB_PSRAM=1
  -DDISABLE_FS_H_WARNING=1
  -DDISABLE_OPDS=1
  -DDISABLE_CALIBRE=1
  -DDISABLE_QR_CODE=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BTDM_CTRL_BLE_MAX_CONN=1
  -DCROSSPOINT_MURPHY_M4=1
  ; Keep the legacy project macro for in-tree conditionals, and select the
  ; current FreeInk SDK device name used by BoardConfig 2.x.
  -DFREEINK_DEVICE_MURPHY_M4=1
  -DFREEINK_DEVICE_MURPHY=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM=1
  -Wl,--wrap=esp_panic_handler
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  -D ARDUINO_LOOP_STACK_SIZE=16384

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py

; file:// (relative) real copies under open-m4-sdk/ — not symlink://, not absolute paths
lib_deps =
  BatteryMonitor=file://open-m4-sdk/libs/hardware/BatteryMonitor
  InputManager=file://open-m4-sdk/libs/hardware/InputManager
  EInkDisplay=file://open-m4-sdk/libs/display/FreeInkDisplay
  SDCardManager=file://open-m4-sdk/libs/hardware/SDCardManager
  BoardConfig=file://open-m4-sdk/libs/hardware/BoardConfig
  FrontlightManager=file://open-m4-sdk/libs/hardware/FrontlightManager
  PowerManager=file://open-m4-sdk/libs/hardware/PowerManager
  ${base.lib_deps_common}

; QEMU-only profile. Real Murphy N16R8 is qio_opi (octal PSRAM). Espressif
; QEMU 9.2.2 hangs while second-stage loads a valid ~5 MiB app when
; ``ssi_psram is_octal=true``; without is_octal the OPI driver fails and aborts.
; Use Quad SPI PSRAM libs here so ``-m 8M`` works without is_octal. QEMU also
; lacks the ADC calibration-done event, so this profile wraps that startup call,
; and routes Arduino Serial to UART0 instead of the real board's USB CDC.
; Do NOT flash this profile to production hardware (real units stay on n16r8 /
; board_build.flash_mode=dio / octal PSRAM).
[env:murphy_m4_qemu]
extends = m4_base
board_build.flash_mode = qio
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
build_unflags =
  ${m4_base.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${m4_base.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-murphy-m4-qemu\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DM4_NATIVE_HEAP_DIAGNOSTIC=1
  -DOMIT_FONTS=1
  -DM4_QEMU_BUILD=1
  -Wl,--wrap=adc_hal_self_calibration

[env:murphy_m4]
extends = m4_base
build_flags =
  ${m4_base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-murphy-m4-rc1\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; Temporary heap-integrity breadcrumbs for native provider crash triage.
  -DM4_NATIVE_HEAP_DIAGNOSTIC=1
  ; APP1 is 7.14 MiB: omit multi-MiB builtin CJK glyph tables. SD /fonts epdfont
  ; remains the Chinese coverage path (Fengyan FontManager/EpdFontLoader).
  -DOMIT_FONTS=1
  ; Embedded Lua 5.4 for .m4x apps (avoid long-long detection issues)
  -DLUA_32BITS=1
  ; USB serial debug bridge is compiled into Murphy M4 only (runtime-gated by
  ; Developer Options → USB serial debugging; default off). Not a separate env.

; QEMU plugin-debug: same Octal/OPI production profile as murphy_m4, but:
;  - UART0 Serial (not USB CDC) for m4adb over QEMU PTY
;  - auto-authorized serial debug bridge
;  - open_eth + DHCP (Wi-Fi is not modeled; plugins use WiFi-compat shims)
; Requires patched QEMU series-v2+ (SPI0 alias) with -machine murphy-m4 -nic open_eth.
; Do NOT flash this env to real hardware.
; NOTE: Do not set M4_QEMU_BUILD here — plugin debug uses the patched QEMU
; SSD1677 direct framebuffer aperture and never dumps frame hex on UART0.
[env:murphy_m4_qemu_plugin]
extends = m4_base
build_unflags =
  ${m4_base.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${m4_base.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-murphy-m4-qemu-plugin\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DM4_NATIVE_HEAP_DIAGNOSTIC=1
  -DOMIT_FONTS=1
  -DLUA_32BITS=1
  -DM4_QEMU_PLUGIN_DEBUG=1
  -DM4_QEMU_PLUGIN_FONT=\"M4Qemu.ttf\"
  -DM4_SCREEN_BRIDGE_ENDPOINT=\"http://192.168.0.195:48624\"
  -DCONFIG_ETH_USE_OPENETH=1
  -Isrc/qemu/openeth
  -Wl,--wrap=adc_hal_self_calibration
build_src_filter =
  +<*>
  +<qemu/>
  +<qemu/openeth/>


; ── Native desktop test environment ──────────────────────────────────────────
; Used for property-based testing and unit testing of platform-independent logic.
; Run tests with: python -m platformio test -e native
; NOTE: Requires MinGW in PATH. Install via: python -m platformio pkg install -g -t toolchain-gccmingw32
;       Then add to PATH: %USERPROFILE%\.platformio\packages\toolchain-gccmingw32\bin
[env:native]
platform = native
platform_packages =
  toolchain-gccmingw32
build_flags =
  -std=c++14
  -DNATIVE_TEST_ENV=1
  -DUNIT_TEST=1
lib_ignore =
  SDCardManager
  EInkDisplay
  InputManager
  BatteryMonitor
  BoardConfig
  FrontlightManager
  PowerManager
  NimBLE-Arduino
  SdFat
  PNGdec
  QRCode
  WebSockets
  GfxRenderer
  hal
  EpdFont
  EpdFontLoader
  Epub
  expat
  FsHelpers
  JpegToBmpConverter
  KOReaderSync
  miniz
  OpdsParser
  picojpeg
  Xtc
  ZipFile
test_framework = unity
test_filter = native/*
test_ignore = native/test_helpers
