plugins {
    id 'com.android.application'
}

android {
    namespace 'com.murphy.m4screenbridge'
    compileSdk 35

    defaultConfig {
        applicationId "com.murphy.m4screenbridge"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
